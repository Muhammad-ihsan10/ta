services:
  # ==========================================
  # DATABASE & TOOLS
  # 1 MySQL container, tiap service punya DB sendiri
  # db_auth | db_gps | db_mpu | db_frontend
  # ==========================================
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      # Database default (wajib diisi MySQL), service lain akan dibuat via init SQL
      MYSQL_DATABASE: db_auth
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./setup_database.sql:/docker-entrypoint-initdb.d/setup_database.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - iot-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-dashboard
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mysql-db
      PMA_USER: root
      PMA_PASSWORD: root
    networks:
      - iot-network

  # ==========================================
  # MQTT BROKER & BRIDGE
  # ==========================================
  mosquitto-broker:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-broker
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./Mosquitto-Broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - iot-network

  mqtt-bridge:
    build:
      context: ./MQTT-Bridge
      dockerfile: Dockerfile
    container_name: mqtt-bridge
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - MQTT_HOST=mosquitto-broker
      - MQTT_PORT=1883
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=root
      # GPS-Service punya database sendiri: db_gps
      - DB_GPS_NAME=db_gps
      # MPU-Service punya database sendiri: db_mpu
      - DB_MPU_NAME=db_mpu
    networks:
      - iot-network

  # ==========================================
  # SPRING BOOT MICROSERVICES
  # ==========================================
  eureka-server:
    build:
      context: ./EurekaServer-Service
      dockerfile: Dockerfile
    container_name: eureka-server
    restart: always
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=eureka-server
    networks:
      - iot-network

  api-gateway:
    build:
      context: ./ApiGateway-Service
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - iot-network

  # Auth-Service → database: db_auth → tabel: users
  auth-service:
    build:
      context: ./Auth-Service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    depends_on:
      eureka-server:
        condition: service_started
      mysql-db:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/db_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - iot-network

  # Bn220-Service (GPS) → database: db_gps → tabel: gps_data
  bn220-service:
    build:
      context: ./Bn220-service
      dockerfile: Dockerfile
    container_name: bn220-service
    restart: always
    depends_on:
      eureka-server:
        condition: service_started
      mysql-db:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/db_gps?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - iot-network

  # Mpu-Service → database: db_mpu → tabel: mpu_data
  mpu-service:
    build:
      context: ./Mpu-service
      dockerfile: Dockerfile
    container_name: mpu-service
    restart: always
    depends_on:
      eureka-server:
        condition: service_started
      mysql-db:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/db_mpu?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - iot-network

  # NotifTele-Service → Kirim notifikasi Telegram saat pasien jatuh (tanpa DB)
  notiftele-service:
    build:
      context: ./NotifTele-Service
      dockerfile: Dockerfile
    container_name: notiftele-service
    restart: always
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_COOLDOWN_SECONDS=${TELEGRAM_COOLDOWN_SECONDS:-60}
    ports:
      - "8086:8086"
    networks:
      - iot-network

  # ==========================================
  # LARAVEL FRONTEND (PHP-FPM + NGINX)
  # Web-Frontend → database: db_frontend → tabel: sessions, cache, dll
  # ==========================================
  frontend-app:
    build:
      context: ./Web-Frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
      api-gateway:
        condition: service_started
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://3.215.157.94
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_DATABASE=db_auth
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - API_GATEWAY_URL=http://api-gateway:8080
    volumes:
      - ./Web-Frontend:/var/www
      - /var/www/vendor
      - /var/www/bootstrap/cache
    networks:
      - iot-network

  frontend-web:
    image: nginx:alpine
    container_name: frontend-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend-app
    volumes:
      - ./Web-Frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./Web-Frontend:/var/www
    networks:
      - iot-network

# ==========================================
# VOLUMES & NETWORKS
# ==========================================
volumes:
  db-data:
  mosquitto-data:
  mosquitto-log:

networks:
  iot-network:
    driver: bridge
