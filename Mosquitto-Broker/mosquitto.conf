# ============================================
# Konfigurasi Mosquitto MQTT Broker
# Proyek: Monitoring Pasien IoT
# ============================================

# --- Network ---
# Dengarkan koneksi di semua interface (0.0.0.0) port 1883
# Ini penting agar ESP32 bisa connect dari jaringan WiFi yang sama
listener 1883 0.0.0.0

# --- Security ---
# Izinkan koneksi tanpa username/password (untuk development)
allow_anonymous true

# --- Logging ---
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe

# --- Persistence ---
# Simpan session ketika broker restart
persistence true
persistence_location ./data/

# --- Connection ---
# Batas maksimum koneksi bersamaan
max_connections 50


